<!doctype html>
<!-- Dueño: Dev C -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · InmoPredict</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%231d3557' d='M8 1 1 7h2v8h4v-5h2v5h4V7h2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-5" style="max-width: 440px">
    <div class="ip-panel">
      <h1 class="h4 ip-titulo-pagina mb-4">Ingresar</h1>
      <form id="form-login" novalidate>
        <div class="mb-3">
          <label class="form-label" for="login-dni">DNI</label>
          <input class="form-control" id="login-dni" name="dni" inputmode="numeric" maxlength="8" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="login-password">Contraseña</label>
          <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="login-mensaje" class="alert alert-danger" role="alert" hidden></div>
        <button class="btn btn-ip w-100" id="btn-login" type="submit">Ingresar</button>
      </form>
      <p class="small text-center mt-3 mb-0">¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/paginas/login.js"></script>
</body>
</html>
