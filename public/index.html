<!doctype html>
<!-- Dueño: Dev C -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · InmoPredict</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%231d3557' d='M8 1 1 7h2v8h4v-5h2v5h4V7h2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-4">
    <h1 class="h3 ip-titulo-pagina mb-3">Inmuebles en venta</h1>

    <form id="form-filtros" class="ip-panel mb-4 row g-2 align-items-end">
      <div class="col-6 col-md-2">
        <label class="form-label small" for="f-tipo">Tipo</label>
        <select class="form-select" id="f-tipo" name="tipo_inmueble">
          <option value="">Todos</option>
          <option value="casa">Casa</option>
          <option value="departamento">Departamento</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" for="f-zona">Zona</label>
        <select class="form-select" id="f-zona" name="zona">
          <option value="">Todas</option>
          <option value="centro">Centro</option>
          <option value="suburbio">Suburbio</option>
          <option value="rural">Rural</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label small" for="f-distrito">Distrito</label>
        <input class="form-control" id="f-distrito" name="distrito" placeholder="¿Dónde buscas?">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" for="f-min">Precio mín. (USD)</label>
        <input class="form-control" id="f-min" name="precio_min" type="number" min="0" step="1000">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" for="f-max">Precio máx. (USD)</label>
        <input class="form-control" id="f-max" name="precio_max" type="number" min="0" step="1000">
      </div>
      <div class="col-12 col-md-1 d-grid">
        <button class="btn btn-ip" type="submit"><i class="bi bi-search"></i><span class="d-md-none"> Buscar</span></button>
      </div>
    </form>

    <p id="estado-catalogo" class="text-secondary small" aria-live="polite"></p>
    <div id="lista-inmuebles" class="row g-4"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/paginas/catalogo.js"></script>
</body>
</html>
