<!doctype html>
<!-- Dueño: Dev C -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro · InmoPredict</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%231d3557' d='M8 1 1 7h2v8h4v-5h2v5h4V7h2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-5" style="max-width: 560px">
    <div class="ip-panel">
      <h1 class="h4 ip-titulo-pagina mb-4">Crear cuenta de propietario</h1>
      <form id="form-registro" class="row g-3" novalidate>
        <div class="col-12">
          <label class="form-label" for="reg-dni">DNI</label>
          <input class="form-control" id="reg-dni" name="dni" inputmode="numeric" maxlength="8" autocomplete="username" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="reg-nombres">Nombres</label>
          <input class="form-control" id="reg-nombres" name="nombres" maxlength="80" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="reg-apellidos">Apellidos</label>
          <input class="form-control" id="reg-apellidos" name="apellidos" maxlength="80" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="reg-telefono">Celular</label>
          <input class="form-control" id="reg-telefono" name="telefono" inputmode="numeric" maxlength="9">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="reg-email">Correo (opcional)</label>
          <input class="form-control" id="reg-email" name="email" type="email" maxlength="120">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="reg-password">Contraseña</label>
          <input class="form-control" id="reg-password" name="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="reg-password2">Repite la contraseña</label>
          <input class="form-control" id="reg-password2" name="password_confirmacion" type="password" autocomplete="new-password" required>
        </div>
        <div class="col-12">
          <div id="registro-mensaje" class="alert" role="alert" hidden></div>
          <button class="btn btn-ip w-100" id="btn-registrar" type="submit">Crear cuenta</button>
        </div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/paginas/registro.js"></script>
</body>
</html>
