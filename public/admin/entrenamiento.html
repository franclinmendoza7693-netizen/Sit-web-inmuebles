<!doctype html>
<!-- Dueño: Dev B -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrenamiento del modelo · InmoPredict</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%231d3557' d='M8 1 1 7h2v8h4v-5h2v5h4V7h2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-4">
    <h1 class="h3 ip-titulo-pagina mb-3">Entrenamiento del modelo</h1>
    <div class="ip-panel">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button class="btn btn-outline-secondary" id="btn-cargar-datos" type="button">1. Cargar datos</button>
        <button class="btn btn-ip" id="btn-entrenar" type="button">2. Entrenar</button>
        <button class="btn btn-outline-secondary" id="btn-evaluar" type="button">3. Evaluar</button>
        <button class="btn btn-outline-success" id="btn-exportar" type="button">4. Exportar modelo</button>
      </div>
      <div id="estado-entrenamiento" class="small text-secondary" aria-live="polite"></div>
      <div id="metricas-modelo" class="mt-3"></div>
      <div id="graficos-entrenamiento" class="mt-3"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@1.5.1/dist/tfjs-vis.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.7.1/papaparse.min.js"></script>
  <script type="module" src="/js/paginas/entrenamiento.js"></script>
</body>
</html>
